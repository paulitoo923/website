<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Paul Sieler · Coaching</title>
  <meta name="description" content="Coming soon">
  <link rel="icon" type="image/x-icon" href="images/favicon.ico">
  <link rel="icon" type="image/png" sizes="32x32" href="images/favicon-32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="images/favicon-16.png">
  <link rel="apple-touch-icon" sizes="180x180" href="images/apple-touch-icon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,300;0,400;1,300;1,400&family=DM+Sans:ital,wght@0,300;0,400;0,500&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    :root {
      --cream-light: #faf7f2;
      --forest: #1a1a1a;
      --white: #fffdf9;

      --font-serif: 'Playfair Display', Georgia, serif;
      --font-sans: 'DM Sans', -apple-system, sans-serif;

      --space-xs: 0.5rem;
      --space-sm: 1rem;
      --space-md: 2rem;
      --space-lg: 4rem;
    }

    html { font-size: 16px; }

    body {
      font-family: var(--font-sans);
      color: var(--white);
      background-color: var(--forest);
      line-height: 1.7;
      -webkit-font-smoothing: antialiased;
      overflow: hidden;
    }

    a { color: inherit; text-decoration: none; }

    /* ========== FULLSCREEN VIDEO STAGE ========== */
    .stage {
      position: relative;
      width: 100vw;
      height: 100vh;
      height: 100dvh;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: var(--space-md);
    }

    .stage-video {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      background-color: #1a1a1a;
      z-index: 0;
    }

    /* Dark veil for legibility — same feel as the old footer */
    .stage::before {
      content: '';
      position: absolute;
      inset: 0;
      background: rgba(26, 26, 26, 0.45);
      z-index: 1;
    }

    .stage-inner {
      position: relative;
      z-index: 2;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: var(--space-lg);
      opacity: 0;
      transform: translateY(24px);
      animation: rise 1.2s cubic-bezier(0.25, 0, 0.25, 1) 0.2s forwards;
    }

    /* "Coming soon" — same styling as the name in the old footer */
    .headline {
      font-family: var(--font-serif);
      font-size: 1.2rem;
      font-weight: 300;
      font-style: italic;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--white);
    }

    /* ========== CTA (same pill as old "Termin finden") ========== */
    .cta-pill {
      display: inline-block;
      position: relative;
      font-family: var(--font-sans);
      font-size: 0.82rem;
      font-weight: 400;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: var(--cream-light);
      background-color: var(--forest);
      padding: 0.8rem 2.2rem;
      border-radius: 50px;
      border: 1px solid var(--white);
      cursor: pointer;
      transition: all 0.4s ease;
      overflow: hidden;
      text-align: center;
      min-width: 220px;
    }

    .cta-pill .cta-label,
    .cta-pill .cta-phone {
      display: block;
      transition: transform 0.4s cubic-bezier(0.25, 0, 0.25, 1),
                  opacity 0.4s cubic-bezier(0.25, 0, 0.25, 1);
    }

    .cta-pill .cta-phone {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, 60%);
      opacity: 0;
      white-space: nowrap;
      font-size: 0.78rem;
      letter-spacing: 0.05em;
      text-transform: none;
    }

    .cta-pill:hover {
      background-color: var(--white);
      color: var(--forest);
    }

    .cta-pill:hover .cta-label {
      transform: translateY(-60%);
      opacity: 0;
    }

    .cta-pill:hover .cta-phone {
      transform: translate(-50%, -50%);
      opacity: 1;
    }

    /* ========== COPYRIGHT (same as old footer copy) ========== */
    .copyright {
      font-family: var(--font-sans);
      font-size: 0.75rem;
      color: var(--white);
    }

    @keyframes rise {
      to { opacity: 1; transform: translateY(0); }
    }

    @media (prefers-reduced-motion: reduce) {
      .stage-inner { animation: none; opacity: 1; transform: none; }
    }

    @media (max-width: 600px) {
      .stage-inner { gap: var(--space-md); }
      .cta-pill { padding: 0.7rem 1.8rem; font-size: 0.78rem; min-width: 200px; }
    }
  </style>
</head>
<body>

  <main class="stage">
    <video class="stage-video" autoplay muted loop playsinline preload="auto">
      <source src="images/vid10.mp4" type="video/mp4">
    </video>

    <div class="stage-inner">
      <h1 class="headline">Coming soon</h1>

      <a href="https://wa.me/491756165395" target="_blank" rel="noopener" class="cta-pill">
        <span class="cta-label">Contact</span>
        <span class="cta-phone">+49 175 6165395</span>
      </a>

      <p class="copyright">&copy; 2026 Paul Sieler. Alle Rechte vorbehalten.</p>
    </div>
  </main>

</body>
</html>
