<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Paul Sieler — Coming soon</title>
  <meta name="description" content="Diese Seite wird gerade überarbeitet. Bald wieder hier.">
  <meta name="robots" content="noindex">
  <link rel="icon" type="image/x-icon" href="images/favicon.ico">
  <link rel="icon" type="image/png" sizes="32x32" href="images/favicon-32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="images/favicon-16.png">
  <link rel="apple-touch-icon" sizes="180x180" href="images/apple-touch-icon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,300;0,400;1,300;1,400&family=DM+Sans:ital,wght@0,300;0,400;0,500&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    :root {
      --cream: #f5f0e8;
      --cream-light: #faf7f2;
      --forest: #1a1a1a;
      --anthracite: #000000;
      --warm-gray: #7a7368;
      --warm-gray-light: #a39d94;

      --font-serif: 'Playfair Display', Georgia, serif;
      --font-sans: 'DM Sans', -apple-system, sans-serif;
    }

    html {
      font-size: 16px;
    }

    body {
      font-family: var(--font-sans);
      font-weight: 400;
      color: var(--anthracite);
      background-color: var(--cream-light);
      line-height: 1.7;
      -webkit-font-smoothing: antialiased;
      min-height: 100vh;
      min-height: 100dvh;
    }

    ::selection {
      background-color: #b5c4a8;
      color: var(--forest);
    }

    .stage {
      position: relative;
      min-height: 100vh;
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: var(--space, 2rem);
      overflow: hidden;
      background-image: url('images/hero-texture.webp');
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
    }

    /* Soft cream veil so text stays legible over the texture */
    .stage::after {
      content: '';
      position: absolute;
      inset: 0;
      background: linear-gradient(
        180deg,
        rgba(250, 247, 242, 0.55) 0%,
        rgba(250, 247, 242, 0.35) 45%,
        rgba(250, 247, 242, 0.65) 100%
      );
      pointer-events: none;
      z-index: 1;
    }

    .content {
      position: relative;
      z-index: 2;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 1.6rem;
      opacity: 0;
      transform: translateY(24px);
      animation: rise 1.1s cubic-bezier(0.25, 0, 0.25, 1) 0.15s forwards;
    }

    .eyebrow {
      font-family: var(--font-sans);
      font-size: 0.8rem;
      letter-spacing: 0.28em;
      text-transform: uppercase;
      font-weight: 400;
      color: var(--warm-gray);
    }

    h1 {
      font-family: var(--font-serif);
      font-weight: 300;
      font-style: italic;
      line-height: 1.1;
      letter-spacing: 0.02em;
      font-size: clamp(3rem, 9vw, 6rem);
      color: var(--forest);
    }

    .tagline {
      font-family: var(--font-sans);
      font-weight: 300;
      font-size: clamp(0.95rem, 1.4vw, 1.15rem);
      color: var(--warm-gray);
      max-width: 34ch;
    }

    .divider {
      width: 46px;
      height: 1px;
      background-color: var(--warm-gray-light);
      opacity: 0.7;
      margin: 0.4rem 0;
    }

    .contact {
      position: relative;
      z-index: 2;
      margin-top: auto;
      padding-top: 3rem;
      font-family: var(--font-sans);
      font-size: 0.78rem;
      letter-spacing: 0.06em;
      color: var(--warm-gray);
      opacity: 0;
      animation: fade 1.4s ease 0.6s forwards;
    }

    .contact a {
      color: var(--forest);
      text-decoration: none;
      border-bottom: 1px solid var(--warm-gray-light);
      padding-bottom: 1px;
      transition: border-color 0.3s ease;
    }

    .contact a:hover {
      border-color: var(--forest);
    }

    @keyframes rise {
      to { opacity: 1; transform: translateY(0); }
    }

    @keyframes fade {
      to { opacity: 1; }
    }

    @media (prefers-reduced-motion: reduce) {
      .content, .contact {
        animation: none;
        opacity: 1;
        transform: none;
      }
    }
  </style>
</head>
<body>
  <main class="stage">
    <div class="content">
      <p class="eyebrow">Paul Sieler</p>
      <h1>Coming soon</h1>
      <div class="divider"></div>
      <p class="tagline">Diese Seite wird gerade neu gestaltet. Bald wieder hier.</p>
    </div>
    <p class="contact">
      Kontakt: <a href="mailto:s.sieler@zeppelin-university.net">s.sieler@zeppelin-university.net</a>
    </p>
  </main>
</body>
</html>
